# API Heist Academy — local educational lab only.
# Do NOT publish ports to the public internet.
services:
  heist:
    build: .
    container_name: api-heist-academy
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DVAPI_HOST: "0.0.0.0"
      DVAPI_PORT: "5000"
      DVAPI_DB: "/data/heist.db"
      DVAPI_SECRET: "${DVAPI_SECRET:?Set DVAPI_SECRET to at least 32 random characters}"
      DVAPI_ADMIN_TOKEN: "${DVAPI_ADMIN_TOKEN:-}"
      DVAPI_WEBHOOK_SECRET: "${DVAPI_WEBHOOK_SECRET:-}"
      DVAPI_FETCH_ALLOWLIST: "${DVAPI_FETCH_ALLOWLIST:-}"
    volumes:
      - heist-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  heist-data:
